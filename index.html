<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3b82"><title>Monitoring Kegiatan & Keuangan</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#14213d}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}header{background:linear-gradient(135deg,#0b3b82,#1769e0);color:white;padding:20px;border-radius:0 0 24px 24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:#ffffff22;display:grid;place-items:center;font-size:24px}h1{font-size:17px;margin:0}.brand p{font-size:12px;margin:4px 0 0;opacity:.85}main{padding:18px 15px 40px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}.tab{padding:12px;border:1px solid #e0e7f0;border-radius:14px;background:white;font-weight:bold;color:#6c7789}.tab.active{background:#eaf2ff;color:#1769e0;border-color:#a9c8ff}.card{border:1px solid #e0e7f0;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 4px 16px #0b3b8209}.card h2{font-size:18px;margin:0 0 14px}.grid{display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d7dfeb;border-radius:11px;font-size:14px;background:#fff}.field textarea{min-height:72px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:bold;cursor:pointer}.primary{background:#1769e0;color:#fff;width:100%}.secondary{background:#eef3f9;color:#14213d}.notice{padding:10px 12px;border-radius:10px;background:#edf6ff;color:#245a9b;font-size:12px;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.sum{background:#f7f9fc;border-radius:13px;padding:12px;text-align:center}.sum strong{display:block;font-size:18px}.sum span{font-size:10px;color:#6c7789}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;padding:11px 12px;border:1px solid #e0e7f0;border-radius:11px}.list{display:grid;gap:10px}.item{border:1px solid #e0e7f0;border-radius:15px;padding:14px}.item h3{font-size:15px;margin:7px 0}.meta{font-size:11px;color:#6c7789;line-height:1.6}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:bold;background:#fff2d5;color:#966300}.done{background:#e6f8eb;color:#16753b}.repair{background:#ffe9e9;color:#a52e2e}.empty,.loading{text-align:center;color:#6c7789;padding:22px}.hidden{display:none}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end}.modal.show{display:flex}.modalbox{width:min(560px,100%);background:white;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:34px;height:34px;background:#eef2f7;font-size:18px}.detail-row{padding:10px 12px;background:#f7f9fc;border-radius:10px;margin:7px 0}.detail-row b{display:block;font-size:10px;color:#6c7789;margin-bottom:3px}.detail-row span{font-size:13px}@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">📁</div><div><h1>Monitoring Kegiatan & Keuangan</h1><p>Sistem pencatatan dan pemantauan berkas</p></div></div></header><main>
<div class="tabs"><button class="tab active" id="ti" onclick="page('input')">➕ Input Data</button><button class="tab" id="tl" onclick="page('list')">📋 Daftar Data</button></div>
<section id="input"><div class="card"><h2>Input Data Kegiatan</h2><div class="notice">Data akan masuk ke Google Sheets setelah URL Apps Script dipasang.</div><form id="form"><div class="grid">
<div class="field"><label>Nama Kegiatan *</label><input id="nama" required></div>
<div class="field"><label>Jenis Kegiatan *</label><select id="jenis" required><option value="">Pilih</option><option>Intelijen Keimigrasian</option><option>Pengawasan Keimigrasian</option><option>Penindakan Keimigrasian</option><option>Operasi Gabungan</option><option>Koordinasi / Timpora</option><option>Kegiatan Lainnya</option></select></div>
<div class="grid two"><div class="field"><label>Nomor Surat Tugas *</label><input id="nomor" required></div><div class="field"><label>Pembuat Laporan *</label><input id="pembuat" required></div></div>
<div class="grid two"><div class="field"><label>Status *</label><select id="status" required><option>Belum Diserahkan</option><option>Sudah Diserahkan</option><option>Diproses Keuangan</option><option>Sudah Dicairkan</option><option>Perlu Perbaikan</option><option>Selesai</option></select></div><div class="field"><label>Tanggal Kegiatan *</label><input id="tglKegiatan" type="date" required></div></div>
<div class="grid two"><div class="field"><label>Tanggal Penyerahan Ke Keuangan</label><input id="tglSerah" type="date"></div><div class="field"><label>Penerima di Keuangan</label><input id="penerima"></div></div>
<div class="grid two"><div class="field"><label>Jumlah Anggaran (Rp)</label><input id="anggaran" type="number" min="0"></div><div class="field"><label>Tanggal Pencairan</label><input id="tglCair" type="date"></div></div>
<div class="field"><label>Keterangan</label><textarea id="keterangan"></textarea></div><button class="btn primary" id="save">💾 Simpan Data</button>
</div></form></div></section>
<section id="list" class="hidden"><div class="summary"><div class="sum"><strong id="total">0</strong><span>Total</span></div><div class="sum"><strong id="proc">0</strong><span>Diproses</span></div><div class="sum"><strong id="done">0</strong><span>Selesai</span></div></div><div class="toolbar"><input class="search" id="search" placeholder="🔎 Cari kegiatan / nomor..." oninput="render()"><button class="btn secondary" onclick="load()">↻</button></div><div id="items" class="list"></div></section>
</main></div>
<div class="modal" id="modal" onclick="outside(event)"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2 id="mt"></h2><div id="detail"></div></div></div>
<script>
const API_URL="";let rows=[];const demo=[{id:"1",nama:"Operasi Gabungan Pengawasan Orang Asing",jenis:"Pengawasan Keimigrasian",nomor:"W.28.IMI.1-GR.03.01-1234",pembuat:"Ahmad",status:"Diproses Keuangan",tglKegiatan:"2026-08-20",tglSerah:"2026-08-25",penerima:"Budi",anggaran:2500000,tglCair:"",keterangan:"Menunggu proses pencairan."},{id:"2",nama:"Koordinasi Timpora",jenis:"Koordinasi / Timpora",nomor:"W.28.IMI.1-GR.03.01-1235",pembuat:"Siti",status:"Selesai",tglKegiatan:"2026-08-18",tglSerah:"2026-08-20",penerima:"Rudi",anggaran:1500000,tglCair:"2026-08-28",keterangan:"Dokumen lengkap."}];
function page(x){input.classList.toggle("hidden",x!="input");list.classList.toggle("hidden",x!="list");ti.classList.toggle("active",x=="input");tl.classList.toggle("active",x=="list");if(x=="list")render()}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function date(x){if(!x)return"-";let d=new Date(x);return isNaN(d)?x:d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"})}
function rup(x){return x?new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(x)):"-"}
function badge(s){let x=(s||"").toLowerCase();return `<span class="badge ${x.includes("selesai")||x.includes("dicairkan")?"done":x.includes("perbaikan")?"repair":""}">${esc(s||"-")}</span>`}
function render(){let q=(search.value||"").toLowerCase(),a=rows.filter(x=>(x.nama+" "+x.nomor+" "+x.pembuat+" "+x.jenis).toLowerCase().includes(q));total.textContent=rows.length;proc.textContent=rows.filter(x=>(x.status||"").toLowerCase().includes("proses")).length;done.textContent=rows.filter(x=>["selesai","sudah dicairkan"].includes((x.status||"").toLowerCase())).length;items.innerHTML=a.length?a.map(x=>`<div class="item" onclick="openDetail('${esc(x.id)}')">${badge(x.status)}<h3>${esc(x.nama)}</h3><div class="meta">📄 ${esc(x.nomor)}<br>👤 ${esc(x.pembuat)} · 📅 ${date(x.tglKegiatan)}<br>💰 ${rup(x.anggaran)}</div></div>`).join(""):'<div class="empty">Data tidak ditemukan.</div>'}
function openDetail(id){let x=rows.find(a=>String(a.id)==String(id));mt.textContent=x.nama;let f=[["Jenis Kegiatan",x.jenis],["Nomor Surat Tugas",x.nomor],["Pembuat Laporan",x.pembuat],["Status",x.status],["Tanggal Kegiatan",date(x.tglKegiatan)],["Tanggal Penyerahan Ke Keuangan",date(x.tglSerah)],["Penerima di Keuangan",x.penerima],["Jumlah Anggaran",rup(x.anggaran)],["Tanggal Pencairan",date(x.tglCair)],["Keterangan",x.keterangan]];detail.innerHTML=f.map(a=>`<div class="detail-row"><b>${a[0]}</b><span>${esc(a[1]||"-")}</span></div>`).join("");modal.classList.add("show")}
function closeModal(){modal.classList.remove("show")}function outside(e){if(e.target.id=="modal")closeModal()}
form.onsubmit=async e=>{e.preventDefault();let d={id:Date.now().toString(),nama:nama.value,jenis:jenis.value,nomor:nomor.value,pembuat:pembuat.value,status:status.value,tglKegiatan:tglKegiatan.value,tglSerah:tglSerah.value,penerima:penerima.value,anggaran:anggaran.value,tglCair:tglCair.value,keterangan:keterangan.value};save.disabled=true;save.textContent="Menyimpan...";try{if(API_URL){let r=await fetch(API_URL,{method:"POST",body:JSON.stringify(d)}),j=await r.json();if(!j.success)throw Error(j.message)}else rows.unshift(d);alert("Data berhasil disimpan.");form.reset();page("list");if(API_URL)await load();else render()}catch(e){alert("Gagal: "+e.message)}save.disabled=false;save.textContent="💾 Simpan Data"};
async function load(){if(!API_URL){rows=[...demo];render();return}try{let r=await fetch(API_URL),j=await r.json();rows=j.data||[];render()}catch(e){items.innerHTML='<div class="empty">Gagal memuat data.</div>'}}load();
</script></body></html>
