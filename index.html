<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Berkas Keuangan - Inteldakim</title>
  <style>
    :root{
      --primary:#0b3b66;
      --primary2:#155d91;
      --gold:#d7a62a;
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#17202a;
      --muted:#6b7280;
      --border:#dbe3ec;
      --success:#1f8a55;
      --warning:#b7791f;
      --danger:#bd3340;
      --shadow:0 8px 24px rgba(14, 42, 72, .08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
    .header{
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      color:#fff;padding:22px 18px 24px;border-bottom-left-radius:24px;border-bottom-right-radius:24px;
    }
    .header small{opacity:.82}
    .header h1{margin:5px 0 0;font-size:22px}
    .header p{margin:6px 0 0;font-size:13px;opacity:.84}
    .content{padding:16px}
    .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-8px}
    .menu-btn{
      border:0;background:var(--card);border-radius:16px;padding:16px 12px;text-align:left;
      box-shadow:var(--shadow);cursor:pointer;min-height:90px;border:1px solid var(--border)
    }
    .menu-btn.active{border:2px solid var(--gold)}
    .menu-btn .icon{font-size:24px}
    .menu-btn strong{display:block;margin-top:7px;font-size:14px}
    .menu-btn span{font-size:11px;color:var(--muted)}
    .panel{
      background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-top:14px;
      box-shadow:var(--shadow)
    }
    .panel-title{font-size:15px;font-weight:750;margin-bottom:10px}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
    select,input{
      width:100%;height:42px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:0 11px;
      font-size:13px;color:var(--text);outline:none
    }
    select:focus,input:focus{border-color:var(--primary2)}
    .search{margin-top:10px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .stat{padding:10px;border-radius:13px;background:#f7f9fc;border:1px solid var(--border)}
    .stat strong{display:block;font-size:17px}
    .stat span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    .list{margin-top:12px;display:grid;gap:10px}
    .item{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px}
    .item-top{display:flex;justify-content:space-between;gap:8px}
    .item-title{font-weight:750;font-size:14px;line-height:1.35}
    .badge{font-size:10px;font-weight:750;padding:5px 8px;border-radius:999px;white-space:nowrap}
    .b-belum{background:#eef2f7;color:#5f6b78}
    .b-proses{background:#fff4db;color:#9a6900}
    .b-cair{background:#eaf3ff;color:#185a96}
    .b-selesai{background:#e7f7ef;color:#1e7448}
    .meta{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}
    .meta div{background:#f8fafc;border-radius:10px;padding:7px}
    .meta b{display:block;font-size:9px;color:var(--muted);margin-bottom:2px}
    .timeline{margin-top:10px;border-left:2px solid #dbe7f3;padding-left:12px}
    .step{position:relative;padding-bottom:8px;font-size:11px}
    .step:before{content:"";position:absolute;left:-19px;top:2px;width:8px;height:8px;border-radius:50%;background:#9fb4c9}
    .step.active:before{background:var(--gold)}
    .step strong{display:block;font-size:11px}
    .step span{color:var(--muted)}
    .empty{text-align:center;padding:22px;color:var(--muted);font-size:12px}
    .bottom{
      position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
      display:flex;justify-content:center;z-index:10
    }
    .bottom-inner{width:min(560px,100%);display:grid;grid-template-columns:repeat(3,1fr)}
    .nav{
      border:0;background:#fff;padding:11px 4px 10px;font-size:10px;color:var(--muted);cursor:pointer
    }
    .nav.active{color:var(--primary);font-weight:750}
    .nav .ni{display:block;font-size:18px;margin-bottom:2px}
    .footer-note{font-size:10px;color:var(--muted);text-align:center;margin-top:14px}
    @media(max-width:390px){.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <small>SEKSI INTELIJEN DAN PENINDAKAN KEIMIGRASIAN</small>
    <h1>Berkas Keuangan</h1>
    <p>Dashboard mobile untuk pemantauan berkas, anggaran, dan proses pencairan.</p>
  </header>

  <main class="content">
    <section class="menu-grid">
      <button class="menu-btn active" id="btnMasuk" onclick="setDirection('masuk')">
        <div class="icon">📤</div>
        <strong>Berkas ke Keuangan</strong>
        <span>Penyerahan & proses</span>
      </button>
      <button class="menu-btn" id="btnKeluar" onclick="setDirection('keluar')">
        <div class="icon">📥</div>
        <strong>Berkas dari Keuangan</strong>
        <span>Pencairan & hasil</span>
      </button>
    </section>

    <section class="panel">
      <div class="panel-title" id="sectionTitle">Berkas ke Keuangan</div>
      <div class="filters">
        <div>
          <label>Jenis Kegiatan</label>
          <select id="jenis" onchange="render()">
            <option value="">Semua jenis</option>
          </select>
        </div>
        <div>
          <label>Status Proses</label>
          <select id="status" onchange="render()">
            <option value="">Semua status</option>
          </select>
        </div>
      </div>
      <div class="search">
        <label>Pencarian</label>
        <input id="q" type="search" placeholder="Cari nama kegiatan, nomor surat, atau pembuat..." oninput="render()">
      </div>

      <div class="summary">
        <div class="stat"><strong id="countAll">0</strong><span>Total berkas</span></div>
        <div class="stat"><strong id="countProcess">0</strong><span>Dalam proses</span></div>
        <div class="stat"><strong id="countDone">0</strong><span>Selesai/cair</span></div>
      </div>
    </section>

    <section class="list" id="list"></section>
    <div class="footer-note">Data demo mengikuti struktur spreadsheet rekap kegiatan & anggaran.</div>
  </main>
</div>

<nav class="bottom">
  <div class="bottom-inner">
    <button class="nav active" onclick="scrollToTop()"><span class="ni">🏠</span>Beranda</button>
    <button class="nav" onclick="focusSearch()"><span class="ni">🔎</span>Cari</button>
    <button class="nav" onclick="alert('Menu pengaturan dapat dihubungkan ke akun/Google Sheets.')"><span class="ni">⚙️</span>Pengaturan</button>
  </div>
</nav>

<script>
const DATA = [
  {
    id:1, direction:"masuk", nama:"Operasional Kegiatan Mandiri", jenis:"Ops Mandiri",
    surat:"ST-001/INTEL/2026", pembuat:"Petugas Inteldakim", status:"Belum dimulai",
    kegiatan:"2026-08-20", serah:"", penerima:"", anggaran:2500000, cair:"",
    ket:"Menunggu kelengkapan dokumen"
  },
  {
    id:2, direction:"masuk", nama:"Operasional Kegiatan Mandiri", jenis:"Ops Mandiri",
    surat:"ST-002/INTEL/2026", pembuat:"Petugas Inteldakim", status:"Dalam proses",
    kegiatan:"2026-08-22", serah:"2026-08-25", penerima:"Keuangan", anggaran:3750000, cair:"",
    ket:"Berkas sedang diverifikasi"
  },
  {
    id:3, direction:"masuk", nama:"Operasi Intelijen", jenis:"Ops Intelijen",
    surat:"ST-003/INTEL/2026", pembuat:"Petugas Intelijen", status:"Proses Pencairan",
    kegiatan:"2026-08-18", serah:"2026-08-21", penerima:"Keuangan", anggaran:5000000, cair:"2026-08-29",
    ket:"Menunggu proses pencairan"
  },
  {
    id:4, direction:"keluar", nama:"Koordinasi Timpora", jenis:"Timpora",
    surat:"ST-004/INTEL/2026", pembuat:"Petugas Inteldakim", status:"Selesai",
    kegiatan:"2026-08-10", serah:"2026-08-12", penerima:"Keuangan", anggaran:4200000, cair:"2026-08-26",
    ket:"Dana telah dicairkan"
  }
];

const statusClass = {
  "Belum dimulai":"b-belum",
  "Dalam proses":"b-proses",
  "Proses Pencairan":"b-cair",
  "Selesai":"b-selesai"
};

let direction="masuk";

function rupiah(n){
  return n ? new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n) : "-";
}
function fmtDate(v){
  if(!v) return "-";
  const [y,m,d]=v.split("-");
  return `${d}-${m}-${y}`;
}
function setDirection(v){
  direction=v;
  document.getElementById("btnMasuk").classList.toggle("active",v==="masuk");
  document.getElementById("btnKeluar").classList.toggle("active",v==="keluar");
  document.getElementById("sectionTitle").textContent =
    v==="masuk" ? "Berkas ke Keuangan" : "Berkas dari Keuangan";
  render();
}
function populateFilters(){
  const jenis=[...new Set(DATA.map(x=>x.jenis))];
  const status=[...new Set(DATA.map(x=>x.status))];
  document.getElementById("jenis").innerHTML='<option value="">Semua jenis</option>'+jenis.map(x=>`<option>${x}</option>`).join("");
  document.getElementById("status").innerHTML='<option value="">Semua status</option>'+status.map(x=>`<option>${x}</option>`).join("");
}
function render(){
  const jenis=document.getElementById("jenis").value;
  const status=document.getElementById("status").value;
  const q=document.getElementById("q").value.toLowerCase().trim();
  const rows=DATA.filter(x=>x.direction===direction)
    .filter(x=>!jenis||x.jenis===jenis)
    .filter(x=>!status||x.status===status)
    .filter(x=>!q||`${x.nama} ${x.surat} ${x.pembuat} ${x.jenis}`.toLowerCase().includes(q));

  document.getElementById("countAll").textContent=rows.length;
  document.getElementById("countProcess").textContent=rows.filter(x=>x.status==="Dalam proses"||x.status==="Proses Pencairan").length;
  document.getElementById("countDone").textContent=rows.filter(x=>x.status==="Selesai").length;

  const list=document.getElementById("list");
  if(!rows.length){
    list.innerHTML='<div class="panel empty">Tidak ada data yang sesuai dengan filter.</div>';
    return;
  }
  list.innerHTML=rows.map(x=>`
    <article class="item">
      <div class="item-top">
        <div class="item-title">${x.nama}</div>
        <span class="badge ${statusClass[x.status]||"b-belum"}">${x.status}</span>
      </div>
      <div class="meta">
        <div><b>Jenis</b>${x.jenis}</div>
        <div><b>Nomor Surat Tugas</b>${x.surat}</div>
        <div><b>Tanggal Kegiatan</b>${fmtDate(x.kegiatan)}</div>
        <div><b>Anggaran</b>${rupiah(x.anggaran)}</div>
        <div><b>Diserahkan ke Keuangan</b>${fmtDate(x.serah)}</div>
        <div><b>Pencairan</b>${fmtDate(x.cair)}</div>
      </div>
      <div class="timeline">
        <div class="step active"><strong>Dokumen dibuat</strong><span>${x.pembuat}</span></div>
        <div class="step ${x.serah?'active':''}"><strong>Diserahkan ke Keuangan</strong><span>${fmtDate(x.serah)}</span></div>
        <div class="step ${x.cair?'active':''}"><strong>Pencairan</strong><span>${fmtDate(x.cair)}</span></div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:#6b7280">${x.ket}</div>
    </article>
  `).join("");
}
function focusSearch(){
  document.getElementById("q").focus();
  window.scrollTo({top:280,behavior:"smooth"});
}
function scrollToTop(){window.scrollTo({top:0,behavior:"smooth"});}
populateFilters(); render();
</script>
</body>
</html>
